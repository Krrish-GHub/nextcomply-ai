[project]
name = "nextcomply-ai-demo"
version = "0.1.0"
description = "Local advisory healthcare compliance workflow demo"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6", "uvicorn[standard]==0.34.0", "python-multipart==0.0.20",
  "pydantic-settings==2.7.1", "PyMuPDF==1.25.1", "python-docx==1.1.2", "reportlab==4.2.5", "httpx==0.28.1"
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
